<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 560 640" role="img" aria-label="Brasão da Iglesias Siqueira Pizzas">

    <title>Iglesias Siqueira Pizzas</title>

    <defs>

        <!-- VIEIRA (CONCHA) DO BRASAO SIQUEIRA -->
        <g id="concha">
            <path d="M -19,-3 q 3.8,-8 7.6,0 q 3.8,-8 7.6,0 q 3.8,-8 7.6,0 q 3.8,-8 7.6,0 q 3.8,-8 7.6,0
                     C 18,6 11,14 0,19 C -11,14 -18,6 -19,-3 Z"
                  fill="#f2c318" stroke="#16120e" stroke-width="2.2" stroke-linejoin="round"/>
            <path d="M0,18 L-15,-3 M0,18 L-7.6,-4 M0,18 L0,-5 M0,18 L7.6,-4 M0,18 L15,-3"
                  stroke="#16120e" stroke-width="1.5" fill="none"/>
            <path d="M-7,19 q7,7 14,0" fill="#f2c318" stroke="#16120e" stroke-width="2" stroke-linejoin="round"/>
        </g>

        <!-- FOLHA DE ACANTO DO PAQUIFE (MANTO) -->
        <path id="folha"
              d="M0,0
                 C -34,-8 -74,4 -100,32
                 C -126,60 -134,98 -122,132
                 C -116,104 -102,78 -80,60
                 C -92,86 -94,116 -82,142
                 C -68,116 -62,86 -66,58
                 C -46,72 -22,70 -6,56
                 C -28,48 -42,34 -46,16
                 C -28,26 -12,20 0,0 Z"/>

        <!-- RECORTE DO CAMPO INTERNO DO ESCUDO -->
        <clipPath id="campo">
            <path d="M176,274 H384 V438 C384,484 344,514 280,536 C216,514 176,484 176,438 Z"/>
        </clipPath>

        <!-- LINHA DA BORDADURA (CAMINHO DO LEMA) -->
        <path id="bordadura"
              d="M163,261 H397 V439 C397,493 350,527 280,550 C210,527 163,493 163,439 Z"/>

    </defs>


    <!-- ===================== PAQUIFE (MANTO) ===================== -->

    <g stroke="#16120e" stroke-width="2.5" stroke-linejoin="round">

        <g id="manto-esquerdo">
            <use href="#folha" fill="#d92121" transform="translate(268,214) rotate(-11) scale(1.5)"/>
            <use href="#folha" fill="#f2c318" transform="translate(270,206) rotate(0)   scale(1.42)"/>
            <use href="#folha" fill="#1a3fbf" transform="translate(272,198) rotate(12)  scale(1.2)"/>
            <use href="#folha" fill="#d92121" transform="translate(274,190) rotate(26)  scale(0.95)"/>
            <use href="#folha" fill="#f2c318" transform="translate(276,182) rotate(42)  scale(0.72)"/>
        </g>

        <use href="#manto-esquerdo" transform="translate(560,0) scale(-1,1)"/>

    </g>


    <!-- ===================== ELMO ===================== -->

    <g>
        <path d="M244,152 C244,133 316,133 316,152 L322,222 C322,246 302,258 280,258
                 C258,258 238,246 238,222 Z"
              fill="#c3c7cb" stroke="#16120e" stroke-width="3.2" stroke-linejoin="round"/>

        <path d="M246,146 C258,138 302,138 314,146" fill="none" stroke="#16120e" stroke-width="2.4"/>

        <rect x="248" y="164" width="64" height="11" rx="4"
              fill="#5c6165" stroke="#16120e" stroke-width="2.2"/>

        <path d="M250,190 H310 M251,202 H309 M252,214 H308 M253,226 H307"
              fill="none" stroke="#16120e" stroke-width="2.4"/>

        <path d="M280,232 v20 M270,241 h20" fill="none" stroke="#16120e" stroke-width="3.4"/>

        <circle cx="247" cy="153" r="3.4" fill="#8d9296" stroke="#16120e" stroke-width="1.8"/>
        <circle cx="313" cy="153" r="3.4" fill="#8d9296" stroke="#16120e" stroke-width="1.8"/>
    </g>


    <!-- ===================== TIMBRE: A PIZZA ===================== -->

    <g transform="translate(280,88)">

        <circle r="52" fill="#e0a24a" stroke="#16120e" stroke-width="3.2"/>
        <circle r="42" fill="#e8b23f" stroke="#16120e" stroke-width="2.4"/>

        <path d="M0,-42 A42,42 0 0,1 30,-30 M0,-42 A42,42 0 0,0 -30,-30
                 M-42,0 A42,42 0 0,0 -30,30"
              fill="none" stroke="#c8801f" stroke-width="1.8"/>

        <circle cx="-17" cy="-13" r="8" fill="#a8231a" stroke="#16120e" stroke-width="1.9"/>
        <circle cx="15"  cy="-17" r="8" fill="#a8231a" stroke="#16120e" stroke-width="1.9"/>
        <circle cx="-3"  cy="17"  r="8" fill="#a8231a" stroke="#16120e" stroke-width="1.9"/>
        <circle cx="24"  cy="12"  r="7" fill="#a8231a" stroke="#16120e" stroke-width="1.9"/>
        <circle cx="-26" cy="15"  r="7" fill="#a8231a" stroke="#16120e" stroke-width="1.9"/>

        <ellipse cx="2"   cy="-2" rx="9" ry="5.5" fill="#2f7d32" stroke="#16120e" stroke-width="1.7"
                 transform="rotate(-25 2 -2)"/>
        <ellipse cx="-18" cy="30" rx="8" ry="5" fill="#2f7d32" stroke="#16120e" stroke-width="1.7"
                 transform="rotate(15 -18 30)"/>
        <ellipse cx="29"  cy="-6" rx="8" ry="5" fill="#2f7d32" stroke="#16120e" stroke-width="1.7"
                 transform="rotate(40 29 -6)"/>

    </g>


    <!-- ===================== ESCUDO ===================== -->

    <!-- BORDADURA AZUL COM O LEMA -->
    <path d="M150,248 H410 V440 C410,500 356,538 280,562 C204,538 150,500 150,440 Z"
          fill="#1a3fbf" stroke="#16120e" stroke-width="3.5" stroke-linejoin="round"/>

    <text font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="bold"
          letter-spacing="2.6" fill="#f2c318">
        <textPath href="#bordadura" startOffset="0.5%" textLength="845" lengthAdjust="spacing">
            ESPANHA E PORTUGAL &#9670; AS MELHORES PIZZAS DA IT&#193;LIA &#9670;
        </textPath>
    </text>

    <!-- CAMPO INTERNO: PARTIDO (IGLESIAS | SIQUEIRA) -->
    <g clip-path="url(#campo)">
        <rect x="170" y="268" width="110" height="280" fill="#d92121"/>
        <rect x="280" y="268" width="110" height="280" fill="#1a3fbf"/>
    </g>

    <!-- IGLESIAS: A IGREJA -->
    <g clip-path="url(#campo)">
        <g transform="translate(230,386) scale(0.85)" stroke="#16120e" stroke-linejoin="round">

            <path d="M-26,-68 v-18 M-35,-78 h18" stroke-width="4.5" fill="none"/>

            <path d="M-45,-46 L-26,-69 L-7,-46 Z" fill="#cfc9ba" stroke-width="2.6"/>
            <rect x="-40" y="-46" width="28" height="121" fill="#f2f0e8" stroke-width="2.6"/>

            <path d="M-19,-20 L13,-47 L45,-20 Z" fill="#cfc9ba" stroke-width="2.6"/>
            <rect x="-14" y="-20" width="54" height="95" fill="#f2f0e8" stroke-width="2.6"/>

            <path d="M4,75 V44 a13,13 0 0,1 26,0 v31 Z" fill="#7d3b1c" stroke-width="2.6"/>

            <circle cx="17" cy="8" r="9" fill="#9a5c2c" stroke-width="2.4"/>

            <path d="M-32,-16 V-26 a6,6 0 0,1 12,0 v10 Z" fill="#9a5c2c" stroke-width="2.2"/>
            <path d="M-32,18 V8 a6,6 0 0,1 12,0 v10 Z"    fill="#9a5c2c" stroke-width="2.2"/>
            <path d="M-32,52 V42 a6,6 0 0,1 12,0 v10 Z"   fill="#9a5c2c" stroke-width="2.2"/>

        </g>
    </g>

    <!-- SIQUEIRA: AS CINCO VIEIRAS -->
    <g clip-path="url(#campo)">
        <use href="#concha" transform="translate(308,334)"/>
        <use href="#concha" transform="translate(356,334)"/>
        <use href="#concha" transform="translate(308,396)"/>
        <use href="#concha" transform="translate(356,396)"/>
        <use href="#concha" transform="translate(332,458)"/>
    </g>

    <!-- PARTICAO E CONTORNO DO CAMPO -->
    <path d="M280,274 V536" stroke="#16120e" stroke-width="3.2" fill="none"/>
    <path d="M176,274 H384 V438 C384,484 344,514 280,536 C216,514 176,484 176,438 Z"
          fill="none" stroke="#16120e" stroke-width="3.5" stroke-linejoin="round"/>


    <!-- ===================== FITA COM O NOME ===================== -->

    <g stroke="#16120e" stroke-width="3.2" stroke-linejoin="round">

        <path d="M64,570 L26,556 L40,586 L26,616 L64,614 Z" fill="#cfc7b4"/>
        <path d="M496,570 L534,556 L520,586 L534,616 L496,614 Z" fill="#cfc7b4"/>

        <path d="M64,570 C150,554 410,554 496,570 L496,614 C410,598 150,598 64,614 Z" fill="#efe9dc"/>

    </g>

    <text x="280" y="594" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold"
          letter-spacing="2" fill="#16120e" textLength="396" lengthAdjust="spacingAndGlyphs">
        IGLESIAS SIQUEIRA PIZZAS
    </text>

</svg>
